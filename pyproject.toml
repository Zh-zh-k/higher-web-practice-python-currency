version = "0.1.0"
description = "Python service for parsing and check currency rate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "scrapy>=2.14.1",
    "uvicorn>=0.41.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.20",
    "email-validator>=2.0",
    "greenlet>=3.5.5",
    "bcrypt<5",
]
